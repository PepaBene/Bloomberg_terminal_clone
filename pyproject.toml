[project]
name = "bloomberg-data-fabric"
version = "0.1.0"
description = "Financial data platform for fundamental research - Data Fabric (Pillar 1)"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.5.0",
    # Validation & settings
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    # Auth
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    # HTTP client
    "httpx>=0.27.0",
    # Multipart file uploads (UploadFile/File)
    "python-multipart>=0.0.9",
    # Entity resolution
    "rapidfuzz>=3.0.0",
    "python-Levenshtein>=0.25.0",
    "metaphone>=0.6",
    # Data processing
    "pandas>=2.0.0",
    # xlsx parsing (FHLB Office of Finance debt-statistics file has no CSV/JSON export)
    "openpyxl>=3.1.0",
    # Cache & search
    "redis[hiredis]>=5.0.0",
    "elasticsearch[async]>=8.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    # Batch scheduler (scripts/run_scheduler.py)
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "testcontainers[postgres]>=4.0.0",
    "ruff>=0.8.0",
]
gui = [
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.0",
    "numpy>=1.26.0",
]
analytics = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
]

[project.scripts]
bloomberg-terminal = "src.gui.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
