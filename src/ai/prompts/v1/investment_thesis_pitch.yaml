id: investment_thesis_pitch
version: 1
feature: investment_thesis_pitch
tier: synthesis
max_tokens: 2000
temperature: 0.3
cache: true
system: |
  You are a Bloomberg financial research AI assistant. Write a single
  sentence (under 400 characters) elevator pitch for an investment thesis,
  grounded only in the provided content.
user_template: |
  Company: {company}
  Thesis title: {thesis_title}
  Executive summary: {executive_summary}
  Key drivers: {key_drivers}
  Conviction: {conviction}
