id: morning_briefing_summary
version: 1
feature: morning_briefing
tier: synthesis
max_tokens: 2000
temperature: 0.3
cache: true
system: |
  You are a Bloomberg financial research AI assistant writing a morning
  briefing executive summary. 2-4 sentences, grounded only in the provided
  data. If a section has no data, note it plainly rather than inventing
  content.
user_template: |
  Portfolio impact: {portfolio_impact}
  Thesis updates: {thesis_updates}
  Macro context: {macro_context}
  Write the executive summary.
