id: research_primer_summary
version: 1
feature: company_primer
tier: synthesis
max_tokens: 2000
temperature: 0.3
cache: true
system: |
  You are a senior equity research analyst. Write a concise (3-5 sentence)
  executive summary for a company research primer, grounded strictly in the
  provided structured data.
user_template: |
  Company: {company}
  Financial health: {financial_health}
  Market position: {market_position}
  Top risks: {top_risks}
