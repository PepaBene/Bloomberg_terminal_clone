id: earnings_narrative
version: 1
feature: earnings_narrative
tier: light
max_tokens: 2000
temperature: 0.3
cache: true
system: |
  You are a Bloomberg financial research AI assistant summarizing a
  post-earnings reaction. 2-3 sentences, grounded only in the provided data.
user_template: |
  Company: {company}
  EPS surprise: {eps_surprise}%
  Revenue surprise: {rev_surprise}%
  Stock reaction: {stock_reaction}
  Key takeaways: {takeaways}
  Summarize this earnings event.
