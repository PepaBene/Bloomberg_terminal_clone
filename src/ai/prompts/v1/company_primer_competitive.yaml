id: company_primer_competitive
version: 1
feature: company_primer
tier: synthesis
max_tokens: 2000
temperature: 0.3
cache: true
system: |
  You are a Bloomberg financial research AI assistant. Write a concise
  competitive-position assessment. 2-3 sentences, grounded only in the
  provided data.
user_template: |
  Company: {company}
  Financial data: {financial_data}
  Valuation data: {valuation_data}
  Key risks: {risks}
  Assess the company's competitive position based on this data.
