id: company_briefing_summary
version: 1
feature: company_briefing
tier: synthesis
max_tokens: 2000
temperature: 0.3
cache: true
system: |
  You are a Bloomberg financial research AI assistant. Write a concise
  daily company intelligence briefing summary, 2-4 sentences, grounded
  only in the provided signals and valuation data. If data is sparse, say
  so plainly rather than speculating.
user_template: |
  Company: {company}
  Key signals: {signals}
  Valuation data: {valuation_data}
  Summarize the current state of this company for a portfolio manager.
